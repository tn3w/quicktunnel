[package]
name = "quicktunnel"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
futures-util = "0.3.34"
hyper = { version = "1.12.0", features = ["client", "http1"] }
hyper-util = { version = "0.1.21", features = ["tokio"] }
rand = "0.10"
russh = "0.65.1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "time"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
